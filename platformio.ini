[platformio]
default_envs = hid
src_dir = firmware

[env]
platform = atmelavr@5.1.0
board = micro
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:calibration]
build_src_filter = +<calibration_firmware/> -<hid_firmware/>

[env:hid]
build_src_filter = -<calibration_firmware/> +<hid_firmware/>
board_build.usb_product = Vectrex USB Controller
